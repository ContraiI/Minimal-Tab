<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title data-i18n="transTitle">翻译</title>
  <link rel="stylesheet" href="translation.css">
</head>
<body>

  <!-- 顶部标题栏与设置入口 -->
  <header class="trans-header">
    <h1 class="trans-title" data-i18n="transTitle">翻译</h1>
    <button type="button" class="settings-btn" id="settingsBtn" data-i18n-title="transSettingsTitle" title="翻译设置">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.484.484 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
  </header>

  <!-- 语言栏:源语言 / 调换 / 目标语言 -->
  <div class="lang-bar">
    <div class="lang-select" id="sourceLangSelect">
      <button type="button" class="lang-trigger" id="sourceLangTrigger">
        <span class="lang-trigger-label" data-i18n="transDetect">自动检测</span>
      </button>
      <div class="lang-list" id="sourceLangList" role="listbox"></div>
    </div>

    <button type="button" class="swap-btn" id="swapBtn" data-i18n-title="transSwapTitle" title="调换源语言与目标语言">
      <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
    </button>

    <div class="lang-select" id="targetLangSelect">
      <button type="button" class="lang-trigger" id="targetLangTrigger">
        <span class="lang-trigger-label">中文</span>
      </button>
      <div class="lang-list" id="targetLangList" role="listbox"></div>
    </div>
  </div>

  <!-- 翻译输入区(含清空按钮) -->
  <div class="input-area">
    <textarea id="transInput" data-i18n-placeholder="transInputPlaceholder" placeholder="输入要翻译的文本..." spellcheck="false"></textarea>
    <button type="button" class="clear-btn" id="clearBtn" data-i18n-title="transClearTitle" title="清空输入">
      <svg viewBox="0 0 24 24"><path d="M18.3 5.71L12 12l-6.3-6.29-1.41 1.42L10.59 13.41 4.29 19.7l1.41 1.42 6.3-6.29 6.3 6.29 1.41-1.42-6.3-6.29 6.3-6.29z"/></svg>
    </button>
  </div>

  <!-- 翻译结果区(状态 + 译文) -->
  <div class="result-area" id="resultArea">
    <div class="result-header" data-i18n="transResultLabel">翻译结果</div>
    <div class="result-status hidden" id="resultStatus"></div>
    <div class="result-text" id="resultText"></div>
  </div>

  <!-- 设置覆盖层(完全覆盖翻译界面) -->
  <div id="settingsOverlay" class="settings-overlay">
    <div class="settings-panel">
      <div class="settings-header">
        <span data-i18n="transSettingsTitle">翻译设置</span>
        <button type="button" class="settings-close-btn" id="settingsCloseBtn" data-i18n-title="transSettingsClose" title="关闭设置">
          <svg viewBox="0 0 24 24"><path d="M18.3 5.71L12 12l-6.3-6.29-1.41 1.42L10.59 13.41 4.29 19.7l1.41 1.42 6.3-6.29 6.3 6.29 1.41-1.42-6.3-6.29 6.3-6.29z"/></svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="setting-row">
          <label class="setting-label" data-i18n="transSettingsEngine">翻译引擎</label>
          <div class="lang-select" id="engineSelect">
            <button type="button" class="lang-trigger" id="engineTrigger">
              <span class="lang-trigger-label">Google</span>
            </button>
            <div class="lang-list" id="engineList" role="listbox"></div>
          </div>
        </div>
        <!-- 引擎配置字段区,由 translation.js 动态渲染 -->
        <div id="engineFields"></div>

        <!-- 网页翻译设置:目标语言 + 呈现方式 + 悬浮球开关 -->
        <div class="settings-section-label" data-i18n="sectionPageTrans">网页翻译</div>
        <div class="setting-row">
          <label class="setting-label" data-i18n="pageTransTarget">目标语言</label>
          <div class="lang-select" id="pageTargetSelect">
            <button type="button" class="lang-trigger" id="pageTargetTrigger">
              <span class="lang-trigger-label"></span>
            </button>
            <div class="lang-list" id="pageTargetList" role="listbox"></div>
          </div>
        </div>
        <div class="setting-row">
          <label class="setting-label" data-i18n="pageTransMode">呈现方式</label>
          <div class="theme-mode-seg" id="pageModeSelect" role="radiogroup">
            <button type="button" class="theme-mode-opt" role="radio" data-mode="replace" data-i18n="pageTransModeReplace">仅译文</button>
            <button type="button" class="theme-mode-opt" role="radio" data-mode="bilingual" data-i18n="pageTransModeBilingual">双语对照</button>
          </div>
        </div>

        <!-- 译文样式:仅双语对照时显示,默认折叠;只影响双语译文 -->
        <div id="pageTransStyleSection" class="section-collapse collapsed">
          <div class="settings-section-label section-collapse-header" id="pageTransStyleToggle" data-i18n="pageTransStyleTitle">译文样式</div>
          <div class="section-collapse-body" id="pageTransStyleBody">
            <!-- B 区:译文样式单选(无 / 下划线A / 下划线B / 下划线C),左端圆点 + 第二行译文预览(语言随目标语言) -->
            <div id="pageTransStyleSelect" role="radiogroup">
              <label class="style-radio-opt">
                <input type="radio" name="pageTransStyle" value="none">
                <span class="radio-dot"></span>
                <span class="style-opt-body">
                  <span class="style-opt-name" data-i18n="pageTransStyleNone">无</span>
                  <span class="style-preview"></span>
                </span>
              </label>
              <label class="style-radio-opt">
                <input type="radio" name="pageTransStyle" value="underlineA">
                <span class="radio-dot"></span>
                <span class="style-opt-body">
                  <span class="style-opt-name" data-i18n="pageTransStyleUnderlineA">虚线下划线</span>
                  <span class="style-preview pt-underlineA"></span>
                </span>
              </label>
              <label class="style-radio-opt">
                <input type="radio" name="pageTransStyle" value="underlineB">
                <span class="radio-dot"></span>
                <span class="style-opt-body">
                  <span class="style-opt-name" data-i18n="pageTransStyleUnderlineB">直线下划线</span>
                  <span class="style-preview pt-underlineB"></span>
                </span>
              </label>
              <label class="style-radio-opt">
                <input type="radio" name="pageTransStyle" value="underlineC">
                <span class="radio-dot"></span>
                <span class="style-opt-body">
                  <span class="style-opt-name" data-i18n="pageTransStyleUnderlineC">细虚线下划线</span>
                  <span class="style-preview pt-underlineC"></span>
                </span>
              </label>
              <label class="style-radio-opt">
                <input type="radio" name="pageTransStyle" value="borderA">
                <span class="radio-dot"></span>
                <span class="style-opt-body">
                  <span class="style-opt-name" data-i18n="pageTransStyleBorderA">虚线边框</span>
                  <span class="style-preview pt-borderA"></span>
                </span>
              </label>
              <label class="style-radio-opt">
                <input type="radio" name="pageTransStyle" value="borderB">
                <span class="radio-dot"></span>
                <span class="style-opt-body">
                  <span class="style-opt-name" data-i18n="pageTransStyleBorderB">直线边框</span>
                  <span class="style-preview pt-borderB"></span>
                </span>
              </label>
            </div>

            <!-- A 区:字体颜色 + 边框颜色 + 斜体 + 粗体 -->
            <div class="style-color-row">
              <span data-i18n="pageTransFontColor">字体颜色</span>
              <div class="color-actions">
                <button type="button" class="color-default-btn" id="pageTransFontColorDefault" data-i18n-title="pageTransColorReset" title="恢复默认">
                  <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                </button>
                <span class="theme-color-swatch picker-trigger" id="pageTransFontColorTrigger" data-i18n-title="colorPicker" title="取色器"></span>
              </div>
            </div>
            <div id="pageTransFontColorPanel" class="color-picker-panel">
              <div class="picker-row">
                <canvas id="pageTransFontPalette" class="picker-palette" width="160" height="160"></canvas>
                <canvas id="pageTransFontHueBar" class="picker-hue-bar" width="20" height="160"></canvas>
              </div>
              <div class="picker-input-row">
                <input type="text" id="pageTransFontHex" class="picker-hex-input" placeholder="#000000" maxlength="7">
                <button id="pageTransFontConfirm" class="picker-confirm-btn" data-i18n="btnConfirm">确定</button>
              </div>
            </div>

            <!-- 边框颜色:仅样式为下划线类时显示,绑定当前样式独立的线条颜色 -->
            <div id="pageTransLineColorBlock" class="style-color-block" hidden>
              <div class="style-color-row">
                <span data-i18n="pageTransLineColor">边框颜色</span>
                <div class="color-actions">
                  <button type="button" class="color-default-btn" id="pageTransLineColorDefault" data-i18n-title="pageTransColorReset" title="恢复默认">
                    <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                  </button>
                  <span class="theme-color-swatch picker-trigger" id="pageTransLineColorTrigger" data-i18n-title="colorPicker" title="取色器"></span>
                </div>
              </div>
              <div id="pageTransLineColorPanel" class="color-picker-panel">
                <div class="picker-row">
                  <canvas id="pageTransLinePalette" class="picker-palette" width="160" height="160"></canvas>
                  <canvas id="pageTransLineHueBar" class="picker-hue-bar" width="20" height="160"></canvas>
                </div>
                <div class="picker-input-row">
                  <input type="text" id="pageTransLineHex" class="picker-hex-input" placeholder="#000000" maxlength="7">
                  <button id="pageTransLineConfirm" class="picker-confirm-btn" data-i18n="btnConfirm">确定</button>
                </div>
              </div>
            </div>

            <label class="setting-toggle">
              <span data-i18n="pageTransItalic">斜体</span>
              <input type="checkbox" id="pageTransItalic">
              <span class="toggle-switch"></span>
            </label>
            <label class="setting-toggle">
              <span data-i18n="pageTransBold">粗体</span>
              <input type="checkbox" id="pageTransBold">
              <span class="toggle-switch"></span>
            </label>
          </div>
        </div>

        <label class="setting-toggle">
          <span data-i18n="pageTransBall">悬浮球</span>
          <input type="checkbox" id="pageBallToggle">
          <span class="toggle-switch"></span>
        </label>
      </div>
    </div>
  </div>

  <script src="lang.js"></script>
  <script src="translate-engine.js"></script>
  <script src="translation.js"></script>
</body>
</html>
