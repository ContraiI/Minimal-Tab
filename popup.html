<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title data-i18n="popupTitle">Minimal Tab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- 品牌标识 -->
  <div class="popup-brand">
    <span class="brand-dot"></span>
    <span class="brand-name">Minimal Tab</span>
  </div>

  <!-- 打开浏览器翻译侧边栏 -->
  <button type="button" class="open-btn" id="openPanelBtn" data-i18n="popupOpenPanel">打开翻译边栏</button>

  <!-- 整页翻译开关,文案由 popup.js 按状态填充 -->
  <button type="button" class="page-btn" id="pageToggleBtn"></button>

  <script src="lang.js"></script>
  <script src="popup.js"></script>
</body>
</html>
